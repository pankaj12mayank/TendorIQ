# TenderIQ Lite — local production-like stack (API + Web)
# Usage: copy .env.example → .env, then: docker compose up --build

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8000
      RELOAD: 'false'
      DATABASE_DRIVER: sqlite
      SQLITE_PATH: /data/tenderiq.db
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_PATH: /data/uploads
    volumes:
      - tenderiq_data:/data
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    depends_on:
      api:
        condition: service_healthy

volumes:
  tenderiq_data:
