# Optional Docker stack for API + MySQL (matches run.bat / local-setup.md).
# Default: no Redis. Email/OCR use in-process inline jobs.
#
#   docker compose up -d
#   docker compose --profile with-redis up -d   # optional rate-limit experiments

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+aiomysql://root:password@mysql:3306/tenderiq?charset=utf8mb4
      NODE_ENV: development
      ALLOW_START_WITHOUT_DB: "false"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: tenderiq
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    profiles: ["with-redis"]
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  redis_data:
