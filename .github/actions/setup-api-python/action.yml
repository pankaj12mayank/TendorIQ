name: Setup API Python
description: Create api/venv and install requirements.txt

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install API dependencies into venv
      shell: bash
      run: |
        python -m venv api/venv
        api/venv/bin/pip install --upgrade pip
        api/venv/bin/pip install -r api/requirements.txt

    - name: Expose venv Python on PATH
      shell: bash
      run: echo "${{ github.workspace }}/api/venv/bin" >> "$GITHUB_PATH"

