name: Setup API Python
description: Create apps/api/venv and install requirements-dev.txt (same graph as run.bat)

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install API dependencies into venv
      shell: bash
      run: |
        python -m venv apps/api/venv
        apps/api/venv/bin/pip install --upgrade pip
        apps/api/venv/bin/pip install -r apps/api/requirements-dev.txt

    - name: Expose venv Python on PATH
      shell: bash
      run: echo "${{ github.workspace }}/apps/api/venv/bin" >> "$GITHUB_PATH"
