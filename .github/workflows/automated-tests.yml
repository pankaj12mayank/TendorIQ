name: Automated Testing

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2am

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests-api:
    name: API Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          cd apps/api
          uv sync
      - name: Run unit tests
        run: |
          cd apps/api
          uv run pytest tests/unit -v --cov=src --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: apps/api/coverage.xml
          flags: api

  unit-tests-web:
    name: Web Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm --filter @tendoriq/web test --coverage
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          flags: web

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - name: Run integration tests
        run: |
          cd apps/api
          uv sync
          uv run pytest tests/integration -v

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build:web
      - name: Start preview
        run: pnpm preview &
        sleep 10
      - name: Run E2E tests
        run: pnpm --filter @tendoriq/web e2e || true
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: apps/web/playwright-report

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli
          lhci autorun --upload.target=temporary-public-storage || true

  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run dependency audit
        run: |
          pnpm audit --audit-level=high || true
      - name: Run Bandit
        run: |
          pip install bandit
          bandit -r apps/api/src -f json || true
      - name: Run npm audit
        run: |
          cd apps/web
          npm audit --audit-level=high || true

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests-api, unit-tests-web, integration-tests, e2e-tests]
    if: always()
    steps:
      - name: Create summary
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          api_result="${{ needs.unit-tests-api.result }}"
          web_result="${{ needs.unit-tests-web.result }}"
          integ_result="${{ needs.integration-tests.result }}"
          e2e_result="${{ needs.e2e-tests.result }}"
          
          echo "| Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| API Unit Tests | $api_result |" >> $GITHUB_STEP_SUMMARY
          echo "| Web Unit Tests | $web_result |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | $integ_result |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | $e2e_result |" >> $GITHUB_STEP_SUMMARY
          
          if [[ "$api_result" == "success" && "$web_result" == "success" ]]; then
            echo "All critical tests passed! 🚀" >> $GITHUB_STEP_SUMMARY
          fi