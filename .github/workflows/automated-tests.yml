name: Automated Testing

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests-api:
    name: API Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: |
          cd apps/api
          uv sync
      - name: Run unit tests
        run: |
          cd apps/api
          uv run pytest tests/unit -v --cov=src --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: apps/api/coverage.xml
          flags: api

  unit-tests-web:
    name: Web Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm --filter @tendoriq/web test --coverage
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          flags: web

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: test
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: |
          cd apps/api
          uv sync
      - name: Run integration tests
        run: |
          cd apps/api
          uv run pytest tests/integration -v

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter @tendoriq/web build
      - name: Start preview
        env:
          PORT: '3000'
        run: |
          pnpm --filter @tendoriq/web preview &
          sleep 15
      - name: Run E2E tests
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: pnpm --filter @tendoriq/web e2e
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: apps/web/playwright-report

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli
          lhci autorun --upload.target=temporary-public-storage

  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run pnpm audit
        run: pnpm audit --audit-level=high
      - name: Run Bandit
        run: |
          pip install bandit
          bandit -r apps/api/src -f json
      - name: Run pnpm audit (web workspace)
        run: pnpm --filter @tendoriq/web audit --audit-level=high

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests-api, unit-tests-web, integration-tests, e2e-tests]
    if: always()
    steps:
      - name: Create summary
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          api_result="${{ needs.unit-tests-api.result }}"
          web_result="${{ needs.unit-tests-web.result }}"
          integ_result="${{ needs.integration-tests.result }}"
          e2e_result="${{ needs.e2e-tests.result }}"

          echo "| Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| API Unit Tests | $api_result |" >> $GITHUB_STEP_SUMMARY
          echo "| Web Unit Tests | $web_result |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | $integ_result |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | $e2e_result |" >> $GITHUB_STEP_SUMMARY

          if [[ "$api_result" == "success" && "$web_result" == "success" ]]; then
            echo "All critical tests passed!" >> $GITHUB_STEP_SUMMARY
          fi
