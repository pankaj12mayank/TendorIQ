name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Frontend
        run: pnpm --filter @tendoriq/web lint

  lint-python:
    name: Python Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          cd apps/api
          uv sync

      - name: Run ruff
        run: |
          cd apps/api
          uv run ruff check src/ tests/

      - name: Run mypy
        run: |
          cd apps/api
          uv run mypy src/ --strict

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript Check (web)
        run: pnpm --filter @tendoriq/web typecheck

  typecheck-shared:
    name: Typecheck Shared
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript Check (shared)
        run: pnpm --filter @tendoriq/shared typecheck

  test-api:
    name: API Unit Tests
    runs-on: ubuntu-latest
    needs: [lint-python]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          cd apps/api
          uv sync

      - name: Reliability gate — compile & import app
        env:
          DATABASE_URL: mysql+aiomysql://root:test@127.0.0.1:3306/tendoriq_test?charset=utf8mb4
          JWT_SECRET: ci-test-secret-key-at-least-32-characters-long
        run: |
          cd apps/api
          uv run python -m compileall -q src
          uv run python scripts/verify_import.py

      - name: Run API unit & contract tests
        env:
          DATABASE_URL: mysql+aiomysql://root:test@127.0.0.1:3306/tendoriq_test?charset=utf8mb4
          JWT_SECRET: ci-test-secret-key-at-least-32-characters-long
        run: |
          cd apps/api
          uv run pytest tests/unit tests/integration -q

  test:
    name: Web Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck, typecheck-shared, test-api]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm --filter @tendoriq/web test -- --run

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, test-api]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Frontend
        run: pnpm --filter @tendoriq/web build
