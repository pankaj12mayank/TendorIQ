name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Frontend
        run: pnpm --filter @tendoriq/web lint

  lint-python:
    name: Python Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-api-python

      - name: Run ruff
        working-directory: apps/api
        run: ruff check src/ tests/

      - name: Run mypy
        working-directory: apps/api
        run: mypy src/ --strict

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript Check (web)
        run: pnpm --filter @tendoriq/web typecheck

  typecheck-shared:
    name: Typecheck Shared
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript Check (shared)
        run: pnpm --filter @tendoriq/shared typecheck

  test-api:
    name: API Unit Tests
    runs-on: ubuntu-latest
    needs: [lint-python]

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: tenderiq_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -ptest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-api-python

      - name: Apply migrations
        working-directory: apps/api
        env:
          DATABASE_URL: mysql+aiomysql://root:test@127.0.0.1:3306/tenderiq_test?charset=utf8mb4
          ALLOW_START_WITHOUT_DB: '0'
        run: alembic upgrade head

      - name: Reliability gate — compile & import app
        env:
          DATABASE_URL: mysql+aiomysql://root:test@127.0.0.1:3306/tendoriq_test?charset=utf8mb4
          JWT_SECRET: ci-test-secret-key-at-least-32-characters-long
          ALLOW_START_WITHOUT_DB: '0'
        working-directory: apps/api
        run: |
          python -m compileall -q src
          python scripts/verify_import.py

      - name: Run API unit & contract tests
        working-directory: apps/api
        env:
          DATABASE_URL: mysql+aiomysql://root:test@127.0.0.1:3306/tenderiq_test?charset=utf8mb4
          JWT_SECRET: ci-test-secret-key-at-least-32-characters-long
          ALLOW_START_WITHOUT_DB: '0'
        run: pytest tests/unit tests/integration -q

  test:
    name: Web Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck, typecheck-shared, test-api]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm --filter @tendoriq/web test -- --run

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, test-api]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Frontend
        run: pnpm --filter @tendoriq/web build
