name: Production Readiness

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-ready-${{ github.ref }}
  cancel-in-progress: false

jobs:
  env-validation:
    name: Environment Validation
    runs-on: ubuntu-latest
    outputs:
      valid: ${{ steps.validate.outputs.valid }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate environment template
        id: validate
        run: |
          test -f .env.example
          grep -q '^DATABASE_URL=' .env.example
          grep -q '^JWT_SECRET=' .env.example
          echo "Environment template documents core MySQL + JWT settings"
          echo "valid=true" >> $GITHUB_OUTPUT

  security-scan:
    name: Security Checks
    runs-on: ubuntu-latest
    needs: env-validation
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run security audit
        run: pnpm audit --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check for vulnerabilities
        run: |
          cd apps/api
          pip install safety bandit
          safety check --json -o security-report.json
          bandit -r src/ -f json -o bandit-report.json

  build-validation:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate build output
        run: |
          pnpm --filter @tendoriq/web build
          if [ ! -d "apps/web/.next" ]; then
            echo "Next.js build output (.next) missing"
            exit 1
          fi
      - uses: ./.github/actions/setup-api-python
      - name: Check API builds
        working-directory: apps/api
        run: uvicorn --version

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-validation
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: test
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api-python
      - name: Run integration tests
        working-directory: apps/api
        run: pytest tests/integration -v

  production-checklist:
    name: Production Checklist
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api-python
      - name: Run production checklist validation
        working-directory: apps/api
        run: python -c "
import subprocess
import sys
import os

exit_code = 0

# 1. Check linting configured
if os.path.exists('apps/api/pyproject.toml'):
    with open('apps/api/pyproject.toml') as f:
        content = f.read()
        if 'ruff' in content:
            print('PASS: Ruff configured')
        else:
            print('FAIL: Ruff not configured')
            exit_code = 1
else:
    print('FAIL: pyproject.toml not found')
    exit_code = 1

# 2. Check test scripts configured
if os.path.exists('package.json'):
    with open('package.json') as f:
        content = f.read()
        if 'test' in content:
            print('PASS: Test scripts configured')
        else:
            print('FAIL: No test script')
            exit_code = 1

# 3. Check production settings
if os.path.exists('apps/api/src/config.py'):
    with open('apps/api/src/config.py') as f:
        content = f.read()
        if 'PRODUCTION' in content or 'production' in content:
            print('PASS: Production configuration exists')
        else:
            print('WARN: No production config detected')

# 4. Check API deploy config (Railway / Nixpacks — no Docker)
if os.path.exists('apps/api/railway.json'):
    with open('apps/api/railway.json') as f:
        content = f.read()
        if '/health' in content and 'uvicorn' in content:
            print('PASS: railway.json health + start command')
        else:
            print('WARN: railway.json missing health or uvicorn')
else:
    print('WARN: apps/api/railway.json not found')
if os.path.exists('docker-compose.yml') or os.path.exists('apps/api/Dockerfile'):
    print('FAIL: Docker artifacts should not be in repo')
    exit_code = 1
else:
    print('PASS: No Docker compose/Dockerfile in repo')

# 5. Check env validation
required_files = ['.env.production.example', '.env']
found = [f for f in required_files if os.path.exists(f)]
if found:
    print(f'PASS: Env files present: {found}')
else:
    print('FAIL: No env files found')
    exit_code = 1

# 6. Check security headers
if os.path.exists('apps/api/src/middleware.py'):
    with open('apps/api/src/middleware.py') as f:
        content = f.read()
        headers = ['Strict-Transport-Security', 'Content-Security-Policy', 'X-Content-Type-Options']
        missing_headers = [h for h in headers if h not in content]
        if missing_headers:
            print(f'FAIL: Missing security headers: {missing_headers}')
            exit_code = 1
        else:
            print('PASS: Security headers present')

# 7. Check migration files
import glob
migrations = glob.glob('apps/api/migrations/versions/*.py')
if migrations:
    print(f'PASS: {len(migrations)} migration files present')
else:
    print('FAIL: No migration files found')
    exit_code = 1

sys.exit(exit_code)
"

  deploy-ready:
    name: Deploy Ready
    runs-on: ubuntu-latest
    needs: production-checklist
    if: success()
    steps:
      - name: Create deployment trigger
        run: |
          echo "Ready for production deployment!"
          echo "All validation checks passed successfully."

  notify-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: deploy-ready
    if: success()
    steps:
      - name: Post to Slack
        run: |
          echo "Deployment pipeline completed successfully"

  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: deploy-ready
    if: failure()
    steps:
      - name: Notify on failure
        run: |
          echo "Deployment pipeline failed"
