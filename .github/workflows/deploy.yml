name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:web

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

  deploy-backend:
    name: Deploy Backend (Railway)
    runs-on: ubuntu-latest
    environment: production
    if: false # Enable when Railway config is ready

    steps:
      - uses: actions/checkout@v4

      - name: Build and push Docker image
        run: |
          docker build -f apps/api/Dockerfile -t ${{ secrets.REGISTRY }}/tendoriq-api:${{ github.sha }} .
          docker push ${{ secrets.REGISTRY }}/tendoriq-api:${{ github.sha }}

      - name: Deploy to Railway
        uses: railwayapp/action@v1
        with:
          token: ${{ secrets.RAILWAY_TOKEN }}
          service: tendoriq-api
          image: ${{ secrets.REGISTRY }}/tendoriq-api:${{ github.sha }}