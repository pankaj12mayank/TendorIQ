[project]
name = "tenderiq"
version = "1.0.0"
description = "TenderIQ - Tender Management Platform"
requires-python = ">=3.12"
readme = "README.md"

[tool.hatch]
build.targets.hatch.only = []

[tool.uv]
dev-dependencies = [
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pre-commit>=4.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function call in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["api"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
show_column_numbers = true

[[tool.mypy.overrides]]
module = ["pg8000.*", "asyncpg.*", "redis.*", "arq.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["apps/api"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[tool.pre-commit]
default_stages = ["commit"]

[tool.pre-commit.hooks]
ruff = { entry = "ruff check --fix", types = ["python"] }
ruff-format = { entry = "ruff format", types = ["python"] }
mypy = { entry = "mypy", types = ["python"], additional_dependencies = ["types-all"] }